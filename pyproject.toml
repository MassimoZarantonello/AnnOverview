[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling" ]

[project]
name = "annoverview"
version = "0.1.0"
description = "A read-only overview of the annotation rounds in the AnnoCell layout"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "annocell",  # the folder format (AnnoCell, next to this repo): read through it, never written
  "nicegui>=2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]

[project.scripts]
annoverview = "annoverview.app:main"

[tool.uv.sources]
annocell = { path = "../AnnoCell", editable = true }

[tool.hatch.build.targets.wheel]
packages = [ "src/annoverview" ]

[tool.pytest.ini_options]
testpaths = [ "tests" ]

[tool.ruff]
line-length = 120
src = [ "src", "tests" ]

[tool.ruff.lint]
select = [ "E", "F", "I", "UP", "B" ]
